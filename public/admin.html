<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>리딩방 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.adm { display: flex; flex-direction: column; gap: 18px; padding-block: 20px 60px; }
.adm h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 700; }
.adm h2 { margin: 0 0 8px; font-size: 15px; line-height: 1.3; font-weight: 700; }
.box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--raise); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.adm label { font-size: 13px; color: var(--fg-3); }
.adm input[type="text"], .adm input[type="password"], .adm input[type="url"] {
  flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit; font-size: 15px;
}
.adm input[type="file"] { font: inherit; color: var(--fg-3); max-width: 100%; }
.hint { margin: 0; font-size: 12px; line-height: 1.5; color: var(--fg-2); }
.msg { margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg-3); white-space: pre-line; }
.list { display: flex; flex-direction: column; }
.reg-row { align-items: flex-start; }
.reg-thumb { width: 72px; }
.reg-thumb .card img { cursor: zoom-in; }
.reg-l { display: flex; gap: 6px; align-items: center; }
.reg-l input { height: 38px !important; font-size: 13px !important; }
.danger > span { border-color: #d0485e; color: #e0566c; }
.is-hidden .reg-thumb { opacity: 0.45; }
</style>
</head>
<body>
<div class="app">
  <main class="adm gut">
    <h1>리딩방 관리</h1>

    <section class="box" id="loginBox">
      <h2>비밀번호</h2>
      <div class="row">
        <input type="password" id="token" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="관리 비밀번호">
        <button type="button" class="pill" id="showToken" aria-pressed="false"><span>보기</span></button>
        <button type="button" class="pill solid" id="saveToken"><span>확인</span></button>
      </div>
      <p class="hint">서버에 넣은 ADMIN_TOKEN 값이에요. 대소문자를 구분해요. 이 기기에만 저장돼요.</p>
      <p class="msg" id="loginMsg"></p>
    </section>

    <div id="work" hidden>
      <div class="adm" style="padding:0">
        <section class="box">
          <h2>스토리 직접 올리기</h2>
          <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple aria-label="스토리 이미지 선택">
          <div class="row"><button type="button" class="pill solid" id="upload"><span>올리고 자동 분류</span></button></div>
          <p class="msg" id="uploadMsg"></p>
        </section>

        <section class="box">
          <h2>상품링크 등록</h2>
          <div class="row">
            <input type="url" id="linkUrl" placeholder="https://" aria-label="상품링크">
            <button type="button" class="pill solid" id="addLink"><span>등록</span></button>
          </div>
          <p class="hint">15분 안에 올린 스토리 중 링크 없는 것에 붙고, 없으면 다음에 올라오는 스토리에 붙어요.</p>
          <p class="msg" id="linkMsg"></p>
        </section>

        <section>
          <div class="row" role="group" aria-label="보기">
            <button type="button" class="pill chip" data-f="check" aria-pressed="true"><span>확인 필요<small id="cntCheck">0</small></span></button>
            <button type="button" class="pill chip" data-f="nolink" aria-pressed="false"><span>링크 없음<small id="cntNolink">0</small></span></button>
            <button type="button" class="pill chip" data-f="all" aria-pressed="false"><span>전체<small id="cntAll">0</small></span></button>
            <button type="button" class="pill chip" data-f="hidden" aria-pressed="false"><span>숨김<small id="cntHidden">0</small></span></button>
          </div>
          <div class="list" id="list"></div>
        </section>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin.js"></script>
</body>
</html>
