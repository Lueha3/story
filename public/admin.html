<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>리딩방 관리</title>
<link rel="stylesheet" href="/app.css?v=gmarket-sans">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.adm { display: flex; flex-direction: column; gap: 18px; padding-block: 20px 60px; }
.adm h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 700; }
.adm h2 { margin: 0 0 8px; font-size: 15px; line-height: 1.3; font-weight: 700; }
.box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--raise); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.adm label { font-size: 13px; color: var(--fg-3); }
.adm input[type="text"], .adm input[type="password"], .adm input[type="url"] {
  flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit; font-size: 15px;
}
.adm input[type="file"] { font: inherit; color: var(--fg-3); max-width: 100%; }
.hint { margin: 0; font-size: 12px; line-height: 1.5; color: var(--fg-2); }
.msg { margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg-3); white-space: pre-line; }
.list { display: flex; flex-direction: column; }
.reg-row { align-items: flex-start; }
.reg-thumb { width: 72px; }
.reg-thumb .card img { cursor: zoom-in; }
.reg-l { display: flex; gap: 6px; align-items: center; }
.reg-l input { height: 38px !important; font-size: 13px !important; }
.danger > span { border-color: #d0485e; color: #e0566c; }
.is-hidden .reg-thumb { opacity: 0.45; }
.health { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.5; }
.health li { display: flex; justify-content: space-between; gap: 12px; }
.health .ok { color: var(--fg-2); }
.health .bad { color: #e0566c; font-weight: 700; }
/* order sheet after the phone's photo picker */
.pick { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100dvh; z-index: 70; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }
.pick-h { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 6px) max(10px, env(safe-area-inset-right, 0px)) 6px max(6px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.pick-h b { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-x { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; }
.pick-x svg { width: 24px; height: 24px; }
.pick-go { flex: none; height: 44px; display: flex; align-items: center; }
.pick-go span { display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; background: #ffd23f; color: #1c1a0e; font-size: 15px; font-weight: 700; white-space: nowrap; }
.pick-go:disabled { opacity: 1; }
.pick-go:disabled span { background: var(--line-2); color: var(--fg-2); }
.pick-strip { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 10px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.ps { position: relative; flex: none; width: 56px; height: 72px; border-radius: 8px; overflow: hidden; }
.ps img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ps-n { position: absolute; left: 3px; bottom: 3px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #ffd23f; color: #1c1a0e; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.ps-x { position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); color: #ffffff; font-size: 14px; line-height: 17px; text-align: center; }
.pick-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; align-content: start; padding: 2px; }
.pk { position: relative; aspect-ratio: 3 / 4; overflow: hidden; }
.pk img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pk::after { content: ""; position: absolute; inset: 0; border: 3px solid transparent; pointer-events: none; }
.pk.on::after { border-color: #ffd23f; background: rgba(0, 0, 0, 0.18); }
.pk-n { position: absolute; right: 7px; top: 7px; z-index: 1; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.95); background: rgba(0, 0, 0, 0.25); color: #1c1a0e; font-size: 14px; font-weight: 700; line-height: 24px; text-align: center; }
.pk.on .pk-n { border-color: #ffd23f; background: #ffd23f; }
.pick-f { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(12px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); font-size: 12px; color: var(--fg-2); }
</style>
</head>
<body>
<div class="app">
  <main class="adm gut">
    <h1>리딩방 관리</h1>

    <section class="box" id="loginBox">
      <h2>비밀번호</h2>
      <div class="row">
        <input type="password" id="token" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="관리 비밀번호">
        <button type="button" class="pill" id="showToken" aria-pressed="false"><span>보기</span></button>
        <button type="button" class="pill solid" id="saveToken"><span>확인</span></button>
      </div>
      <p class="hint">서버에 넣은 ADMIN_TOKEN 값이에요. 대소문자를 구분해요. 이 기기에만 저장돼요.</p>
      <p class="msg" id="loginMsg"></p>
    </section>

    <div id="work" hidden>
      <div class="adm" style="padding:0">
        <section class="box" id="healthBox">
          <h2>연결 상태</h2>
          <ul class="health" id="health"></ul>
          <p class="msg" id="healthMsg"></p>
        </section>

        <section class="box">
          <h2>프로필 사진</h2>
          <div class="row">
            <div class="avatar" id="avatarNow" aria-hidden="true"></div>
            <input type="file" id="avatarFile" accept="image/*" hidden>
            <button type="button" class="pill solid" id="avatarBtn"><span>프사 바꾸기</span></button>
          </div>
          <p class="msg" id="avatarMsg"></p>
        </section>

        <section class="box">
          <h2>스토리 직접 올리기</h2>
          <input type="file" id="files" accept="image/*" multiple hidden>
          <div class="row"><button type="button" class="pill solid" id="upload"><span>올리고 자동 분류</span></button></div>
          <div class="row" id="locateRow" hidden><button type="button" class="pill" id="locate"><span>지난 스토리 버튼 위치 찾기</span></button></div>
          <p class="msg" id="uploadMsg"></p>
        </section>

        <section class="box">
          <h2>상품링크 등록</h2>
          <div class="row">
            <input type="url" id="linkUrl" placeholder="https://" aria-label="상품링크">
            <button type="button" class="pill solid" id="addLink"><span>등록</span></button>
          </div>
          <p class="hint">15분 안에 올린 스토리 중 링크 없는 것에 붙고, 없으면 다음에 올라오는 스토리에 붙어요.</p>
          <p class="msg" id="linkMsg"></p>
        </section>

        <section>
          <div class="row" role="group" aria-label="보기">
            <button type="button" class="pill chip" data-f="check" aria-pressed="true"><span>확인 필요<small id="cntCheck">0</small></span></button>
            <button type="button" class="pill chip" data-f="nolink" aria-pressed="false"><span>링크 없음<small id="cntNolink">0</small></span></button>
            <button type="button" class="pill chip" data-f="all" aria-pressed="false"><span>전체<small id="cntAll">0</small></span></button>
            <button type="button" class="pill chip" data-f="hidden" aria-pressed="false"><span>숨김<small id="cntHidden">0</small></span></button>
          </div>
          <div class="list" id="list"></div>
        </section>
      </div>
    </div>
  </main>
</div>
<div class="pick" id="pick" role="dialog" aria-modal="true" aria-label="올릴 순서 정하기" hidden>
  <div class="pick-h">
    <button type="button" class="pick-x" id="pickClose" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>
    </button>
    <b>올릴 순서대로 눌러주세요</b>
    <button type="button" class="pick-go" id="pickGo" disabled><span>올리기</span></button>
  </div>
  <div class="pick-strip" id="pickStrip" hidden></div>
  <div class="pick-grid" id="pickGrid"></div>
  <div class="pick-f">
    <button type="button" class="pill" id="pickAll"><span>고른 순서로 모두 선택</span></button>
    <span>마지막 번호가 사이트 맨 앞에 와요</span>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin.js?v=1795417554"></script>
</body>
</html>
