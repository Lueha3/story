<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="인스타 스토리에 올린 꿀템을 카테고리별로 모아보는 곳">
<title>실시간 꿀템 리딩방</title>
<link rel="stylesheet" href="/app.css?v=1795481630">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="top gut">
    <div class="who">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="who-t">
        <h1>실시간 꿀템 리딩방</h1>
        <span id="handle"></span>
      </div>
    </div>
    <p class="status"><i aria-hidden="true"></i><span id="statusText">불러오는 중이에요</span></p>
  </header>

  <div id="tabsAnchor"></div>
  <nav class="tabs" aria-label="카테고리">
    <button type="button" class="order-btn" id="orderBtn" aria-label="정렬 순서 바꾸기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"></path><path d="M3 16l4 4 4-4"></path><path d="M17 20V4"></path><path d="M13 8l4-4 4 4"></path></svg>
      <span id="orderLabel">오래된순</span>
    </button>
    <div class="tabs-list" id="tabsList"></div>
  </nav>

  <main id="feed"><p class="loading gut">스토리를 불러오는 중이에요.</p></main>

</div>

<div class="viewer" id="viewer" tabindex="-1" role="dialog" aria-modal="true" aria-label="스토리 보기" hidden>
  <div class="v-stage">
    <div class="card v-card" id="vCard">
      <img id="vImg" alt="">
      <div class="v-marks" id="vMarks"></div>
      <div class="v-shade" aria-hidden="true"></div>
      <button type="button" class="v-zone v-prev" id="vPrev" aria-label="이전 스토리"></button>
      <button type="button" class="v-zone v-next" id="vNext" aria-label="다음 스토리"></button>
      <div class="v-top">
        <div class="v-segs" id="vSegs" aria-hidden="true"></div>
        <div class="v-head">
          <span class="v-ava" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <span class="v-who"><b id="vHandle"></b><time id="vTime"></time></span>
          <a class="v-go" id="vGo" data-notap href="#" target="_blank" rel="noopener sponsored" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <span>상품 보러가기</span>
          </a>
          <button type="button" class="v-close" id="vClose" data-notap aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
      <a class="v-hot" id="vHot" data-notap href="#" target="_blank" rel="noopener sponsored" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span>상품 링크</span>
      </a>
      <div class="v-flag" id="vFlag" aria-hidden="true"></div>
    </div>
  </div>
  <div class="v-bottom">
  <div class="v-bar">
    <a class="cta" id="vCta" href="#" target="_blank" rel="noopener sponsored">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 4.5H6a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h11.5a2 2 0 0 0 2-2v-4.5"></path><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path></svg>
      <span>상품링크</span>
    </a>
  </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js?v=1795480445"></script>
</body>
</html>
